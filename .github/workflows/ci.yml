name: CI

on:
  push:
    branches: [main, "rc*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      # Actions are pinned to a commit: a tag like v4 can be moved to different code. Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the steps below run the repo's own tests: no token left in .git/config
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Vault rules
        run: python scripts/verify
      - name: Prerequisites (required checks only)
        run: python doctor.py --ci
      - name: Template tests (setup, doctor, jobs, docs)
        run: python -m unittest discover -s tests -v
      - name: Wizard with every module, then the vault rules again
        run: |
          python setup.py --answers tests/risposte-tutti.json --yes
          python scripts/verify
          python install_jobs.py --dry-run --all --os linux --out out-all
      - name: Job files can be generated for every system
        run: |
          python install_jobs.py --dry-run --os linux --out out-linux
          python install_jobs.py --dry-run --os macos --out out-macos
          python install_jobs.py --dry-run --os windows --out out-windows
      - name: Script tests
        run: python -m unittest discover -s scripts -p "test_*.py"

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dependabot bumps the action; the ruff version and its checksum are bumped by hand, together with
      # RUFF_VERSION in doctor.py (tests/test_setup_doctor.py checks that the two match).
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.3"
          # sha256 of ruff-x86_64-unknown-linux-gnu.tar.gz from the 0.17.3 GitHub release
          checksum: "2b0890f5a55900af741f133918c2656919bbf18c2ab7741b4ca8403a90e647a9"
          download-from-astral-mirror: "false"

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
